# Optional override when Authentik runs on the same Docker host. The complete
# NFC Auth stack still provides Caddy, terminal mTLS, and PostgreSQL; only the
# bridge joins Authentik's existing network.
services:
  bridge:
    networks:
      - backend
      - egress
      - authentik

networks:
  authentik:
    external: true
    name: ${AUTHENTIK_DOCKER_NETWORK}
