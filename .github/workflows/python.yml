name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pytest mypy
        python -m pip install .

    - name: Check adapter type annotations
      run: >-
        python -m mypy --strict --follow-imports=silent
        nfc_authenticator/backend.py nfc_authenticator/storage.py nfc_authenticator/discovery.py

    - name: Test protocol and reference backend
      run: python -m pytest -q

    - name: Build package
      run: python -m build

    - name: Upload Python package
      uses: actions/upload-artifact@v7
      with:
        name: python-package
        path: python/dist/*
