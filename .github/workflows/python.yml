name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build mypy
        python -m pip install '.[dev]'

    - name: Check protocol and transport type annotations
      run: >-
        python -m mypy --strict --follow-imports=silent
        nfc_authenticator/protocol_v4.py nfc_authenticator/terminal_transport.py

    - name: Lint
      run: python -m ruff check . ../examples/terminal

    - name: Test protocol, bridge, registration, and token issuance
      run: python -m pytest -q

    - name: Build package
      run: python -m build

    - name: Build bridge container
      working-directory: ${{ github.workspace }}
      run: docker build --file python/Dockerfile python

    - name: Validate Compose deployment options
      working-directory: ${{ github.workspace }}
      run: |
        docker compose --env-file deploy/.env.example \
          -f deploy/docker-compose.yml config -q
        docker compose --env-file deploy/.env.example \
          -f deploy/docker-compose.yml \
          -f deploy/docker-compose.authentik.yml config -q

    - name: Upload Python package
      uses: actions/upload-artifact@v7
      with:
        name: python-package
        path: python/dist/*
